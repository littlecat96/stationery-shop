spring.application.name=stationery-shop

# 网站端口
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# MySQL 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/stationery_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=stationery_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 数据库配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
