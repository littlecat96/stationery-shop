
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理 - 校园文具商城</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f5f6fa;
            font-family: "Microsoft YaHei", sans-serif;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button, .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .primary {
            background: #4b83e6;
            color: white;
        }

        .edit {
            background: #eaf1ff;
            color: #3973d6;
        }

        .delete {
            background: #fff0f0;
            color: #e05252;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            color: #666;
        }

        .price {
            color: #e46c55;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #999;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>校园文具商城</h2>
    <div class="subtitle">订单管理 / 订单列表</div>

    <div class="toolbar">
        <form th:action="@{/admin/orders}" method="get">
            <label for="orderId">订单编号</label>
            <input id="orderId" type="text" name="orderId" inputmode="numeric" th:value="${orderId}">
            <button class="primary" type="submit">搜索</button>
            <a th:if="${!orderId.isEmpty()}" th:href="@{/admin/orders}" class="btn edit">清空搜索</a>
        </form>
        <a th:href="@{/admin/products}" class="btn edit">返回商品管理</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>订单编号</th>
                <th>下单时间</th>
                <th>订单总金额</th>
                <th>订单状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td class="price">￥<span th:text="${order.totalAmount}"></span></td>
                <td th:text="${order.status}"></td>
                <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn edit">查看详情</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="5" class="empty" th:text="${searchError != null ? searchError : (orderId.isEmpty() ? '暂无订单' : '未找到该编号的订单')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
