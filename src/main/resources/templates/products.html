
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理 - 校园文具商城</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f5f6fa;
            font-family: "Microsoft YaHei", sans-serif;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button, .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .primary {
            background: #4b83e6;
            color: white;
        }

        .edit {
            background: #eaf1ff;
            color: #3973d6;
        }

        .delete {
            background: #fff0f0;
            color: #e05252;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            color: #666;
        }

        .price {
            color: #e46c55;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #999;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>校园文具商城</h2>
    <div class="subtitle">商品管理 / 商品列表</div>

    <div class="toolbar">

        <form th:action="@{/admin/products}" method="get">
            <input type="text"
                   name="keyword"
                   placeholder="搜索商品名称..."
                   th:value="${keyword}">
            <button class="primary" type="submit">搜索</button>
        </form>

        <a th:href="@{/admin/orders}" class="btn edit">订单管理</a>
        <a th:href="@{/admin/products/new}" class="btn primary">
            + 添加商品
        </a>

    </div>

    <div class="card">

        <table>
            <thead>
            <tr>
                <th>编号</th>
                <th>商品名称</th>
                <th>分类</th>
                <th>价格</th>
                <th>库存</th>
                <th>操作</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.category}"></td>

                <td class="price">
                    ￥<span th:text="${product.price}"></span>
                </td>

                <td th:text="${product.stock}"></td>

                <td>
                    <a class="btn edit"
                       th:href="@{/admin/products/edit/{id}(id=${product.id})}">
                        编辑
                    </a>

                    <a class="btn delete"
                       th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                       onclick="return confirm('确定删除这个商品吗？')">
                        删除
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="empty">
                    暂无商品数据
                </td>
            </tr>

            </tbody>
        </table>

    </div>

</div>
</body>
</html>
