
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 校园文具商城</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #4b83e6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .message {
            color: red;
            text-align: center;
        }

        a {
            color: #4b83e6;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>校园文具商城</h2>
    <p style="text-align:center;color:#888;">创建你的账号</p>

    <form action="/register" method="post">

        <input type="text"
               name="username"
               placeholder="请输入用户名"
               required>

        <input type="password"
               name="password"
               placeholder="请输入密码"
               minlength="6"
               required>

        <button type="submit">立即注册</button>

    </form>

    <p class="message"
       th:if="${error}"
       th:text="${error}">
    </p>

    <p style="text-align:center;margin-top:20px;">
        已有账号？
        <a href="/login">返回登录</a>
    </p>

</div>

</body>
</html>
